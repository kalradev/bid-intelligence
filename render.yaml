services:
  - type: web
    name: bid-intelligence-backend
    env: python
    plan: free
    buildCommand: cd Backend_py && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd Backend_py && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: 10000
      - key: MONGODB_STRING
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: ENVIRONMENT
        value: production
      - key: PROCESSING_VERSION
        value: 31
      - key: MAX_FILE_SIZE_MB
        value: 50
